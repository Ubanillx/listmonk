name: Build Sanity Check

on:
    pull_request:
      types:
        - opened
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Prepare Dependencies and Build
        run: make dist

      - name: Validate documentation
        run: |
          python -m pip install -r docs/docs/requirements.txt
          mkdocs build --strict --clean -f docs/docs/mkdocs.yml
