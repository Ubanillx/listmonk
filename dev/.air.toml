# Air watches the Go backend and restarts the locally built process on changes.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/listmonk-dev ./cmd"
entrypoint = ["./tmp/listmonk-dev", "--config", "dev/config.local.toml"]
include_ext = ["go", "sql", "toml"]
exclude_dir = [".git", "docs", "frontend", "node_modules", "tmp", "uploads", "vendor"]
exclude_regex = ["_test\\.go$"]
delay = 500
stop_on_error = true
kill_delay = 500

[build.windows]
cmd = "go build -o ./tmp/listmonk-dev.exe ./cmd"
entrypoint = ["tmp\\listmonk-dev.exe", "--config", "dev/config.local.toml"]

[log]
time = true

[misc]
clean_on_exit = true
