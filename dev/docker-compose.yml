services:
  adminer:
    image: adminer:4.8.1-standalone
    restart: always
    ports:
      - 8171:8080
    networks:
      - listmonk-dev

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "6125:1025" # SMTP
      - "8265:8025" # UI
    networks:
      - listmonk-dev

  db:
    image: postgres:13
    ports:
      - "5437:5432"
    networks:
      - listmonk-dev
    environment:
      - POSTGRES_PASSWORD=P9vL2xT7nQ4mK8sR
      - POSTGRES_USER=lmkdev_M7q2Xr8N
      - POSTGRES_DB=lmkdev_M7q2Xr8N
    restart: unless-stopped
    volumes:
      - type: volume
        source: listmonk-dev-db
        target: /var/lib/postgresql/data

  front:
    build:
      context: ../
      dockerfile: dev/app.Dockerfile
    command: ["sh", "dev/run-frontend.sh"]
    ports:
      - "8181:8080"
    environment:
      - LISTMONK_API_URL=http://backend:9173
      - LISTMONK_WATCH_POLLING=true
      # Cypress is only used by the end-to-end test job, not by the Vite dev server.
      - CYPRESS_INSTALL_BINARY=0
      - npm_config_registry=${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
      - YARN_REGISTRY=${YARN_REGISTRY:-https://registry.npmmirror.com}
    depends_on:
      - db
    volumes:
      - ../:/app
      # Do not use Windows-installed native modules inside the Linux container.
      - listmonk-dev-frontend-node-modules:/app/frontend/node_modules
    networks:
      - listmonk-dev

  backend:
    build:
      context: ../
      dockerfile: dev/app.Dockerfile
    command: ["sh", "dev/run-backend.sh"]
    ports:
      - "9173:9173"
    environment:
      - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
      - GOSUMDB=${GOSUMDB:-sum.golang.google.cn}
      - npm_config_registry=${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
      - YARN_REGISTRY=${YARN_REGISTRY:-https://registry.npmmirror.com}
    depends_on:
      - db
    volumes:
      - ../:/app
      - ${USERPROFILE}/go/pkg/mod/cache:/go/pkg/mod/cache
    networks:
      - listmonk-dev

volumes:
  listmonk-dev-db:
  listmonk-dev-frontend-node-modules:

networks:
  listmonk-dev:
